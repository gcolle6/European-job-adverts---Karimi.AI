[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "karimi-normalise"
dynamic = ["version"]
description = "Split job-ad must_have text into single requirements and normalise requirements and titles"
requires-python = ">=3.11"
# The base: rules, tagger, dictionary lookup by identical wording. What it
# cannot do without the extras is said in every result (`translated_by`,
# match `non_cercato`) and in the run report.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "spacy==3.8.*",
    # pinned: a different tagger version tags, and so splits, differently (karimi/config.py)
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# opus-mt, the default translator and the one the quality card was measured with.
# Not needed when the English text is passed in, or another translator is.
translate = ["torch>=2.0", "transformers>=4.40", "sentencepiece>=0.2"]
# The dictionary's own embedding model, for requirements it does not hold word for word.
embed = ["torch>=2.0", "sentence-transformers>=3.0"]
all = ["karimi-normalise[translate,embed]"]
# The HTTP service and the batch job on Cloud Run (karimi_normalise/api.py, job.py).
api = ["fastapi>=0.110", "uvicorn>=0.29", "google-cloud-storage>=2.16", "google-cloud-run>=0.10"]
test = ["pytest>=8"]

[tool.setuptools]
# `karimi` ships whole for now: the rules live there and are shared with the
# analysis. Moving only the modules the library needs is left for later.
packages = ["karimi", "karimi_normalise"]

[tool.setuptools.package-data]
# the judge's guide (tester.GUIDE)
karimi_normalise = ["*.md"]

[tool.setuptools.dynamic]
version = {attr = "karimi_normalise.versions.RULES_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gates: measured scores against fixed thresholds (slow; run before a release)"]
